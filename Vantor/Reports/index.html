<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantor · Dashboard Library</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a0f2c;
    --dark: #0f1f4b;
    --blue: #1a5fd4;
    --sky: #4e9af1;
    --light-blue: #a8cff8;

    --bg: #f0f3f9;
    --surface: #ffffff;
    --surface-tint: #e8edf5;
    --border: #dde4f0;
    --border-strong: #c5d0e3;

    --ink: #0a0f2c;
    --ink-soft: #1f2a4d;
    --muted: #6b7a99;
    --faint: #94a3b8;

    --green: #2ecc71;
    --green-deep: #1a7a40;
    --green-wash: #eafaf1;
    --red: #e74c3c;
    --red-wash: #fdf0f0;
    --amber: #f39c12;
    --amber-deep: #956500;
    --amber-wash: #fffbeb;

    --serif: 'DM Serif Display', 'Georgia', serif;
    --sans: 'Sora', system-ui, 'Helvetica Neue', sans-serif;
    --mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 13.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  /* ─────────────── HEADER ─────────────── */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--dark) 50%, #1a3a7a 100%);
    color: #fff;
    padding: 36px 48px 32px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: "";
    position: absolute;
    top: -60px; right: -60px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(78,154,241,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .header::after {
    content: "";
    position: absolute;
    bottom: -80px; left: 25%;
    width: 500px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(30,215,96,0.05) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 32px;
  }
  .brand-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .brand-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--sky);
    box-shadow: 0 0 0 4px rgba(78,154,241,0.15);
  }
  .brand-name {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #fff;
    font-weight: 700;
  }
  .eyebrow {
    font-size: 10px;
    color: var(--light-blue);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 10px;
  }
  h1.page-title {
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 400;
    line-height: 1.15;
    color: #fff;
    letter-spacing: -0.005em;
  }
  h1.page-title em {
    font-style: italic;
    color: var(--sky);
  }
  .header-meta {
    text-align: right;
    color: #8aadd4;
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: 0.08em;
    line-height: 1.7;
  }
  .header-meta .val {
    color: #fff;
    font-weight: 600;
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 0;
  }

  /* ─────────────── TOOLBAR ─────────────── */
  .toolbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 48px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(10,15,44,0.04);
  }
  .search-box {
    flex: 1;
    max-width: 360px;
    position: relative;
  }
  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search-box input {
    width: 100%;
    padding: 9px 12px 9px 36px;
    font-family: var(--sans);
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-tint);
    color: var(--ink);
    outline: none;
    transition: all 0.15s ease;
  }
  .search-box input:focus {
    border-color: var(--blue);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26,95,212,0.12);
  }
  .toolbar-spacer { flex: 1; }
  .result-count {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.05em;
  }
  .view-toggle {
    display: flex;
    background: var(--surface-tint);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }
  .view-toggle button {
    background: transparent;
    border: none;
    padding: 6px 12px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .view-toggle button.active {
    background: #fff;
    color: var(--blue);
    box-shadow: 0 1px 3px rgba(10,15,44,0.08);
  }
  .view-toggle button:hover:not(.active) { color: var(--navy); }

  /* ─────────────── BODY GRID ─────────────── */
  .body-grid {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    min-height: calc(100vh - 56px);
  }

  /* ─────────────── SIDEBAR ─────────────── */
  .sidebar {
    background: #fff;
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    position: sticky;
    top: 56px;
    align-self: start;
    height: calc(100vh - 56px);
    overflow-y: auto;
  }
  .filter-section {
    margin-bottom: 24px;
  }
  .filter-label {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .filter-label .clear {
    color: var(--blue);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: none;
    font-weight: 500;
  }
  .filter-label .clear:hover { text-decoration: underline; }
  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    color: var(--ink-soft);
    transition: color 0.15s ease;
  }
  .filter-option:hover { color: var(--blue); }
  .filter-option input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: var(--blue);
    cursor: pointer;
  }
  .filter-option .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
  }

  /* ─────────────── MAIN ─────────────── */
  .main {
    padding: 28px 32px 48px;
    overflow-x: hidden;
  }

  /* ─────────────── LIST VIEW ─────────────── */
  .dashboard-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .dashboard-row {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 80px 1fr auto auto;
    gap: 20px;
    align-items: center;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(10,15,44,0.03);
  }
  .dashboard-row:hover {
    border-color: var(--sky);
    box-shadow: 0 4px 12px rgba(10,15,44,0.08);
    transform: translateY(-1px);
  }
  .row-thumb {
    width: 80px;
    height: 56px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .row-body {
    min-width: 0;
  }
  .row-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .row-type {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--blue);
    letter-spacing: 0.14em;
    font-weight: 700;
    text-transform: uppercase;
  }
  .row-date {
    font-size: 11px;
    color: var(--muted);
  }
  .row-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .row-summary {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .row-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .tag.tag-campaign { background: #eef5ff; color: #1a4db0; }
  .tag.tag-pipeline { background: var(--green-wash); color: var(--green-deep); }
  .tag.tag-audience { background: #f5f0ff; color: #5a2d8a; }
  .tag.tag-paid { background: var(--amber-wash); color: var(--amber-deep); }
  .tag.tag-2026 { background: var(--surface-tint); color: var(--ink-soft); }
  .tag.tag-2025 { background: var(--surface-tint); color: var(--muted); }
  .row-metric {
    text-align: right;
    border-left: 1px solid var(--border);
    padding-left: 20px;
  }
  .row-metric .val {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--blue);
    line-height: 1;
    margin-bottom: 4px;
  }
  .row-metric .label {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .row-arrow {
    color: var(--muted);
    font-size: 20px;
    transition: all 0.15s ease;
  }
  .dashboard-row:hover .row-arrow {
    color: var(--blue);
    transform: translateX(2px);
  }

  /* ─────────────── GRID VIEW ─────────────── */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .dashboard-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 2px rgba(10,15,44,0.03);
  }
  .dashboard-card:hover {
    border-color: var(--sky);
    box-shadow: 0 4px 16px rgba(10,15,44,0.1);
    transform: translateY(-2px);
  }
  .card-thumb {
    height: 160px;
    overflow: hidden;
  }
  .card-body {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .card-type {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--blue);
    letter-spacing: 0.14em;
    font-weight: 700;
    text-transform: uppercase;
  }
  .card-date {
    font-size: 11px;
    color: var(--muted);
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .card-summary {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 12px;
    flex: 1;
  }
  .card-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  /* ─────────────── THUMBNAIL TEMPLATES ─────────────── */
  /* Navy hero thumbnail (matches Constellation dashboard) */
  .thumb-navy {
    background: linear-gradient(135deg, #0a0f2c 0%, #0f1f4b 50%, #1a3a7a 100%);
    color: #fff;
    padding: 10px 12px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .thumb-navy::before {
    content: "";
    position: absolute;
    top: -20px; right: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(78,154,241,0.2) 0%, transparent 70%);
  }
  .thumb-navy .t-eyebrow {
    font-size: 6px;
    letter-spacing: 0.25em;
    color: var(--light-blue);
    text-transform: uppercase;
    font-weight: 600;
    position: relative;
    z-index: 1;
  }
  .thumb-navy .t-title {
    font-family: var(--serif);
    font-size: 10px;
    line-height: 1.1;
    position: relative;
    z-index: 1;
  }
  .thumb-navy .t-title em { color: var(--sky); font-style: italic; }
  .thumb-navy .t-kpis {
    display: flex;
    gap: 3px;
    position: relative;
    z-index: 1;
  }
  .thumb-navy .t-kpi {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    padding: 3px 4px;
  }
  .thumb-navy .t-kpi .v {
    font-family: var(--serif);
    font-size: 9px;
    line-height: 1;
    color: var(--sky);
  }
  .thumb-navy .t-kpi.g .v { color: #5dde85; }
  .thumb-navy .t-kpi.a .v { color: #ffc857; }
  .thumb-navy .t-kpi .l {
    font-size: 5px;
    color: var(--light-blue);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  /* Grid version: bigger */
  .card-thumb .thumb-navy { padding: 16px 18px; }
  .card-thumb .thumb-navy .t-eyebrow { font-size: 8px; }
  .card-thumb .thumb-navy .t-title { font-size: 16px; }
  .card-thumb .thumb-navy .t-kpis { gap: 5px; }
  .card-thumb .thumb-navy .t-kpi { padding: 5px 7px; border-radius: 4px; }
  .card-thumb .thumb-navy .t-kpi .v { font-size: 14px; }
  .card-thumb .thumb-navy .t-kpi .l { font-size: 7px; }

  /* Light blue-gray thumbnail (matches Lead Intelligence dashboard) */
  .thumb-light {
    background: #f0f3f9;
    color: var(--navy);
    padding: 10px 12px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .thumb-light .t-eyebrow {
    font-size: 6px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 600;
  }
  .thumb-light .t-title {
    font-family: var(--serif);
    font-size: 10px;
    line-height: 1.1;
    color: var(--navy);
  }
  .thumb-light .t-kpis {
    display: flex;
    gap: 3px;
  }
  .thumb-light .t-kpi {
    flex: 1;
    background: #fff;
    border: 0.5px solid var(--border);
    border-radius: 3px;
    padding: 3px 4px;
  }
  .thumb-light .t-kpi .v {
    font-family: var(--serif);
    font-size: 9px;
    line-height: 1;
    color: var(--blue);
  }
  .thumb-light .t-kpi.g .v { color: var(--green-deep); }
  .thumb-light .t-kpi.r .v { color: #b22222; }
  .thumb-light .t-kpi .l {
    font-size: 5px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .card-thumb .thumb-light { padding: 16px 18px; }
  .card-thumb .thumb-light .t-eyebrow { font-size: 8px; }
  .card-thumb .thumb-light .t-title { font-size: 16px; }
  .card-thumb .thumb-light .t-kpis { gap: 5px; }
  .card-thumb .thumb-light .t-kpi { padding: 5px 7px; border-radius: 4px; }
  .card-thumb .thumb-light .t-kpi .v { font-size: 14px; }
  .card-thumb .thumb-light .t-kpi .l { font-size: 7px; }

  /* ─────────────── EMPTY STATE ─────────────── */
  .empty-state {
    text-align: center;
    padding: 64px 24px;
    color: var(--muted);
  }
  .empty-state-icon {
    font-size: 40px;
    color: var(--faint);
    margin-bottom: 16px;
  }
  .empty-state h3 {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--navy);
    margin-bottom: 8px;
    font-weight: 400;
  }
  .empty-state p {
    font-size: 13px;
    color: var(--muted);
  }
  .empty-state .reset-btn {
    margin-top: 16px;
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .empty-state .reset-btn:hover { background: var(--dark); }

  /* ─────────────── ADD NEW (placeholder) ─────────────── */
  .add-new-card {
    background: var(--surface-tint);
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    min-height: 240px;
    cursor: not-allowed;
  }
  .add-new-row {
    background: var(--surface-tint);
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    cursor: not-allowed;
  }
  .add-new-card svg, .add-new-row svg { color: var(--faint); }

  /* ─────────────── RESPONSIVE ─────────────── */
  @media (max-width: 900px) {
    .header { padding: 28px 24px; }
    .header-inner { flex-direction: column; align-items: flex-start; gap: 16px; }
    .header-meta { text-align: left; }
    .toolbar { padding: 12px 24px; flex-wrap: wrap; }
    .search-box { max-width: none; width: 100%; }
    .body-grid { grid-template-columns: 1fr; }
    .sidebar {
      position: static;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
    }
    .main { padding: 20px 24px; }
    .dashboard-row {
      grid-template-columns: 60px 1fr auto;
      gap: 14px;
    }
    .row-thumb { width: 60px; height: 42px; }
    .row-metric { display: none; }
  }
</style>
</head>
<body>

<!-- ─────────────── HEADER ─────────────── -->
<header class="header">
  <div class="header-inner">
    <div>
      <div class="brand-mark">
        <span class="brand-dot"></span>
        <span class="brand-name">Vantor</span>
      </div>
      <div class="eyebrow">Marketing Intelligence</div>
      <h1 class="page-title">Dashboard <em>library</em>.</h1>
    </div>
    <div class="header-meta">
      <div>Total Dashboards</div>
      <div class="val" id="totalCount">— Loading</div>
      <div style="margin-top: 10px;">Last Updated</div>
      <div class="val">May 15, 2026</div>
    </div>
  </div>
</header>

<!-- ─────────────── TOOLBAR ─────────────── -->
<div class="toolbar">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>
    </svg>
    <input type="text" id="searchInput" placeholder="Search dashboards by title, summary, or tag…">
  </div>
  <div class="toolbar-spacer"></div>
  <span class="result-count" id="resultCount">Showing 0 of 0</span>
  <div class="view-toggle">
    <button class="active" data-view="list" id="viewList">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      List
    </button>
    <button data-view="grid" id="viewGrid">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      Grid
    </button>
  </div>
</div>

<!-- ─────────────── BODY GRID ─────────────── -->
<div class="body-grid">

  <!-- SIDEBAR FILTERS -->
  <aside class="sidebar">
    <div class="filter-section">
      <div class="filter-label">
        <span>Type</span>
        <span class="clear" data-clear="type">Clear</span>
      </div>
      <div id="typeFilters"></div>
    </div>

    <div class="filter-section">
      <div class="filter-label">
        <span>Period</span>
        <span class="clear" data-clear="period">Clear</span>
      </div>
      <div id="periodFilters"></div>
    </div>

    <div class="filter-section">
      <div class="filter-label">
        <span>Tags</span>
        <span class="clear" data-clear="tag">Clear</span>
      </div>
      <div id="tagFilters"></div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div id="dashboardContainer"></div>
  </main>

</div>

<script>
  // ════════════════════════════════════════════════════════════════════
  //   DASHBOARD REGISTRY
  //   Add a new dashboard by appending an object to this array.
  //   Required fields: id, file, title, summary, type, period, tags,
  //                    keyMetric (val + label), thumbnail (template object).
  // ════════════════════════════════════════════════════════════════════
  const DASHBOARDS = [
    {
      id: 'constellation-expansion-launch',
      file: 'dashboards/constellation-expansion-launch.html',
      title: 'Constellation Expansion Launch',
      summary: '5-week launch performance covering earned media, paid distribution, owned channels, and qualified pipeline. CEO-led narrative anchored by CNBC at 33.4M UVM.',
      type: 'Campaign',
      period: '2026',
      date: 'May 13, 2026',
      tags: ['Campaign', 'Paid', 'Audience'],
      keyMetric: { val: '53.6M', label: 'Earned UVM' },
      thumbnail: {
        template: 'navy',
        eyebrow: 'Campaign Report',
        title: 'Vantor <em>Vantage</em> &amp; <em>Pulse</em>',
        kpis: [
          { v: '53.6M', l: 'Earned', cls: '' },
          { v: '18.7M', l: 'Paid', cls: 'g' },
          { v: '5', l: 'Leads', cls: 'a' }
        ]
      }
    },
    {
      id: 'website-lead-analysis-2026',
      file: 'dashboards/website-lead-analysis-2026.html',
      title: 'Website Lead Analysis 2026',
      summary: 'Jan–Apr lead quality and channel attribution. 1,201 website-sourced leads with 34.1 percent quality rate. Geography, intent clusters, and spam exclusion analysis.',
      type: 'Pipeline',
      period: '2026',
      date: 'Apr 30, 2026',
      tags: ['Pipeline', 'Paid'],
      keyMetric: { val: '1,201', label: 'Total Leads' },
      thumbnail: {
        template: 'light',
        eyebrow: 'Marketing Intelligence',
        title: 'Lead Intelligence <em>2026</em>',
        kpis: [
          { v: '1,201', l: 'Leads', cls: '' },
          { v: '34%', l: 'Quality', cls: 'g' },
          { v: '37%', l: 'DQ', cls: 'r' }
        ]
      }
    }
    // ─── To add a new dashboard, copy the structure above ────────────
  ];

  // ════════════════════════════════════════════════════════════════════
  //   STATE
  // ════════════════════════════════════════════════════════════════════
  const state = {
    view: 'list',
    search: '',
    filters: {
      type: new Set(),
      period: new Set(),
      tag: new Set()
    }
  };

  // ════════════════════════════════════════════════════════════════════
  //   RENDER: THUMBNAIL HTML
  // ════════════════════════════════════════════════════════════════════
  function renderThumbnail(t) {
    const kpiHtml = t.kpis.map(k =>
      `<div class="t-kpi ${k.cls}"><div class="v">${k.v}</div><div class="l">${k.l}</div></div>`
    ).join('');
    return `
      <div class="thumb-${t.template}">
        <div>
          <div class="t-eyebrow">${t.eyebrow}</div>
          <div class="t-title">${t.title}</div>
        </div>
        <div class="t-kpis">${kpiHtml}</div>
      </div>
    `;
  }

  // ════════════════════════════════════════════════════════════════════
  //   RENDER: FILTERS
  // ════════════════════════════════════════════════════════════════════
  function uniqueValues(field) {
    const counts = {};
    DASHBOARDS.forEach(d => {
      if (field === 'tag') {
        d.tags.forEach(t => counts[t] = (counts[t] || 0) + 1);
      } else {
        const v = d[field];
        if (v) counts[v] = (counts[v] || 0) + 1;
      }
    });
    return counts;
  }

  function renderFilterSection(field, containerId) {
    const counts = uniqueValues(field);
    const html = Object.keys(counts).sort().map(value => {
      const checked = state.filters[field].has(value) ? 'checked' : '';
      return `
        <label class="filter-option">
          <input type="checkbox" data-filter="${field}" data-value="${value}" ${checked}>
          <span>${value}</span>
          <span class="count">${counts[value]}</span>
        </label>
      `;
    }).join('');
    document.getElementById(containerId).innerHTML = html;
  }

  // ════════════════════════════════════════════════════════════════════
  //   FILTER LOGIC
  // ════════════════════════════════════════════════════════════════════
  function matchesFilters(d) {
    // Search match
    if (state.search) {
      const q = state.search.toLowerCase();
      const haystack = [d.title, d.summary, d.type, ...d.tags].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    // Type filter
    if (state.filters.type.size && !state.filters.type.has(d.type)) return false;
    // Period filter
    if (state.filters.period.size && !state.filters.period.has(d.period)) return false;
    // Tag filter (match ANY selected tag)
    if (state.filters.tag.size) {
      const hasMatch = d.tags.some(t => state.filters.tag.has(t));
      if (!hasMatch) return false;
    }
    return true;
  }

  // ════════════════════════════════════════════════════════════════════
  //   RENDER: DASHBOARDS
  // ════════════════════════════════════════════════════════════════════
  function tagClass(tag) {
    const slug = tag.toLowerCase().replace(/\s+/g, '-');
    return `tag-${slug}`;
  }

  function renderListRow(d) {
    const tagsHtml = d.tags.map(t =>
      `<span class="tag ${tagClass(t)}">${t}</span>`
    ).join('');
    return `
      <a class="dashboard-row" href="${d.file}" target="_blank" rel="noopener">
        <div class="row-thumb">${renderThumbnail(d.thumbnail)}</div>
        <div class="row-body">
          <div class="row-meta">
            <span class="row-type">${d.type}</span>
            <span class="row-date">${d.date}</span>
          </div>
          <div class="row-title">${d.title}</div>
          <div class="row-summary">${d.summary}</div>
          <div class="row-tags">${tagsHtml}</div>
        </div>
        <div class="row-metric">
          <div class="val">${d.keyMetric.val}</div>
          <div class="label">${d.keyMetric.label}</div>
        </div>
        <svg class="row-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    `;
  }

  function renderGridCard(d) {
    const tagsHtml = d.tags.map(t =>
      `<span class="tag ${tagClass(t)}">${t}</span>`
    ).join('');
    return `
      <a class="dashboard-card" href="${d.file}" target="_blank" rel="noopener">
        <div class="card-thumb">${renderThumbnail(d.thumbnail)}</div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-type">${d.type}</span>
            <span class="card-date">${d.date}</span>
          </div>
          <div class="card-title">${d.title}</div>
          <div class="card-summary">${d.summary}</div>
          <div class="card-tags">${tagsHtml}</div>
        </div>
      </a>
    `;
  }

  function renderEmpty() {
    return `
      <div class="empty-state">
        <div class="empty-state-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>
          </svg>
        </div>
        <h3>No dashboards match your filters</h3>
        <p>Try removing some filters or clearing your search.</p>
        <button class="reset-btn" onclick="resetAll()">Reset all filters</button>
      </div>
    `;
  }

  function renderDashboards() {
    const filtered = DASHBOARDS.filter(matchesFilters);
    const container = document.getElementById('dashboardContainer');

    document.getElementById('resultCount').textContent =
      `Showing ${filtered.length} of ${DASHBOARDS.length}`;

    if (filtered.length === 0) {
      container.innerHTML = renderEmpty();
      return;
    }

    if (state.view === 'list') {
      const html = filtered.map(renderListRow).join('') +
        `<div class="add-new-row" title="Coming soon — append to DASHBOARDS array in index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add a new dashboard
        </div>`;
      container.className = '';
      container.innerHTML = `<div class="dashboard-list">${html}</div>`;
    } else {
      const html = filtered.map(renderGridCard).join('') +
        `<div class="add-new-card" title="Coming soon — append to DASHBOARDS array in index.html">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <div>Add a new dashboard</div>
        </div>`;
      container.innerHTML = `<div class="dashboard-grid">${html}</div>`;
    }
  }

  // ════════════════════════════════════════════════════════════════════
  //   EVENTS
  // ════════════════════════════════════════════════════════════════════
  function attachEvents() {
    // Search
    document.getElementById('searchInput').addEventListener('input', e => {
      state.search = e.target.value;
      renderDashboards();
    });

    // View toggle
    document.getElementById('viewList').addEventListener('click', () => {
      state.view = 'list';
      document.getElementById('viewList').classList.add('active');
      document.getElementById('viewGrid').classList.remove('active');
      renderDashboards();
    });
    document.getElementById('viewGrid').addEventListener('click', () => {
      state.view = 'grid';
      document.getElementById('viewGrid').classList.add('active');
      document.getElementById('viewList').classList.remove('active');
      renderDashboards();
    });

    // Filter checkboxes (delegated)
    document.querySelector('.sidebar').addEventListener('change', e => {
      if (e.target.type !== 'checkbox') return;
      const field = e.target.dataset.filter;
      const value = e.target.dataset.value;
      if (e.target.checked) state.filters[field].add(value);
      else state.filters[field].delete(value);
      renderDashboards();
    });

    // Clear filter sections
    document.querySelectorAll('.clear').forEach(el => {
      el.addEventListener('click', () => {
        const field = el.dataset.clear;
        state.filters[field].clear();
        renderFilterSection(field, field + 'Filters');
        renderDashboards();
      });
    });
  }

  function resetAll() {
    state.search = '';
    document.getElementById('searchInput').value = '';
    state.filters.type.clear();
    state.filters.period.clear();
    state.filters.tag.clear();
    renderFilterSection('type', 'typeFilters');
    renderFilterSection('period', 'periodFilters');
    renderFilterSection('tag', 'tagFilters');
    renderDashboards();
  }

  // ════════════════════════════════════════════════════════════════════
  //   INIT
  // ════════════════════════════════════════════════════════════════════
  document.getElementById('totalCount').textContent = DASHBOARDS.length;
  renderFilterSection('type', 'typeFilters');
  renderFilterSection('period', 'periodFilters');
  renderFilterSection('tag', 'tagFilters');
  renderDashboards();
  attachEvents();

  console.log('%c Vantor · Dashboard Library ', 'background: #0a0f2c; color: #4e9af1; padding: 8px 16px; font-family: monospace; font-size: 12px;');
  console.log('To add a dashboard, edit the DASHBOARDS array near the top of this file\'s <script> tag.');
</script>
</body>
</html>
